<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar com o Rosto - Portaria Digital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navegação Superior -->
    <header class="top-bar">
        <a href="/login" class="brand">
            <span class="brand-badge"></span>
            <span>Portaria Digital</span>
        </a>
        <nav class="nav-menu">
            <a href="/cadastro" class="nav-link">Cadastrar rosto</a>
            <a href="/login" class="nav-link active" aria-current="page">Entrar</a>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-container">
        <div class="grid-desk">
            
            <!-- Coluna Esquerda: Visor da Câmera -->
            <section class="visor-container">
                <div id="visor-wrapper" class="visor-wrapper">
                    <div class="visor-frame">
                        <video id="webcam" class="visor-video" autoplay playsinline muted></video>
                        <canvas id="canvas" class="visor-canvas"></canvas>
                        <div id="visor-snapshot" class="visor-snapshot"></div>
                    </div>
                    <!-- SVG Anel de Progresso ao Redor do Oval -->
                    <svg class="visor-svg-ring" viewBox="0 0 300 380" aria-hidden="true">
                        <path d="M 150 15 A 135 175 0 1 1 149.99 15 Z" class="ring-track" />
                        <path d="M 150 15 A 135 175 0 1 1 149.99 15 Z" class="ring-fill" id="ring-fill" />
                    </svg>
                </div>
                <div class="visor-status-box" aria-live="polite">
                    <span id="visor-reason" class="visor-reason" style="display: none;"></span>
                </div>
            </section>

            <!-- Coluna Direita: Painel de Ação -->
            <section class="panel">
                
                <!-- Formulário / Ação Principal -->
                <div id="panel-main-section" style="display: flex; flex-direction: column; gap: 24px;">
                    <div class="panel-header">
                        <h1 class="panel-title">Entrar com o rosto</h1>
                        <p class="panel-subtext">Posicione-se em frente à câmera e clique no botão para liberar seu acesso.</p>
                    </div>

                    <button id="btn-login" class="btn btn-primary" type="button">
                        <span>Entrar</span>
                    </button>
                </div>

                <!-- Crachá de Resultado (Revelado no Sucesso ou Falha) -->
                <div id="badge-card" class="badge-card">
                    <div class="badge-header">
                        <div class="badge-icon-status"></div>
                        <h2 class="badge-status-title"></h2>
                    </div>
                    <div class="badge-user-name"></div>
                    <div class="badge-meta"></div>
                    <div class="badge-actions">
                        <a href="/login" id="btn-badge-retry" class="btn btn-primary">Tentar novamente</a>
                        <a href="/login" id="btn-badge-logout" class="btn btn-secondary">Sair</a>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
